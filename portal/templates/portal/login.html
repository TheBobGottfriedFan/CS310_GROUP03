{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Patient Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{% static 'portal/styles.css' %}">
</head>

<body class="auth-page">
    <div class="login-box login-box-lg">
        <div class="login-header">
            <div class="logo-badge">🩺</div>
            <h2>Welcome back</h2>
            <p class="muted" style="margin: 6px 0 0 0; font-size: 0.95rem;">
                Sign in to access your health portal.
            </p>
        </div>

        {% if error %}
            <div class="alert">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" autocomplete="on">
            {% csrf_token %}

            <label class="field-label" for="username">Username or Email</label>
            <input
                id="username"
                type="text"
                name="email"
                placeholder="Enter your username or email"
                autocomplete="username"
                required
            />

            <label class="field-label" for="password">Password</label>
            <div class="password-row">
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                />
            </div>

            <button type="submit">Sign In →</button>
        </form>

        <div class="login-footer">
            <p class="muted" style="margin: 0; font-size: 0.85rem;">
                🔒 Your health information is protected and encrypted.
            </p>
        </div>
    </div>
</body>
</html>
