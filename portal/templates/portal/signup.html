{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Creation | Patient Portal</title>
  <link rel="stylesheet" href="{% static 'portal/styles.css' %}">
</head>
<body>
  <div class="login-page">
    <div class="login-card" style="max-width:520px;">
      <div style="text-align:center; margin-bottom:20px;">
        <h1 style="margin:0 0 8px;">CREATE ACCOUNT</h1>
        <p style="margin:0; color:var(--text-muted);">SIGN UP A NEW PATIENT.</p>
      </div>
      {% if error %}
        <div style="margin-bottom:14px; padding:12px 14px; border-radius:12px; background:rgba(239,68,68,0.10); border:1px solid rgba(239,68,68,0.18); color:#991b1b;">
          {{ error }}
        </div>
      {% endif %}
      <form method="POST" action="{% url 'portal:signup' %}" style="display:flex; flex-direction:column; gap:14px;">
        {% csrf_token %}
        <input
          type="email"
          name="email"
          placeholder="Email"
          required
          style="padding:12px 14px; border:1px solid var(--border); border-radius:12px;"
        >
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <input
            type="text"
            name="first_name"
            placeholder="First name"
            style="padding:12px 14px; border:1px solid var(--border); border-radius:12px;"
          >
          <input
            type="text"
            name="last_name"
            placeholder="Last name"
            style="padding:12px 14px; border:1px solid var(--border); border-radius:12px;"
          >
        </div>
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
          style="padding:12px 14px; border:1px solid var(--border); border-radius:12px;"
        >
        <input
          type="password"
          name="confirm_password"
          placeholder="Confirm password"
          required
          style="padding:12px 14px; border:1px solid var(--border); border-radius:12px;"
        >
        <button class="btn btn-sm" type="submit" style="width:100%;">CREATE YOUR ACCOUNT</button>
      </form>
      <div style="margin-top:16px; text-align:center;">
        <span style="color:var(--text-muted);">Do YOU already have an account?</span>
        <a href="{% url 'portal:login' %}" style="margin-left:6px; font-weight:700; text-decoration:none;">Log in</a>
      </div>
    </div>
  </div>
</body>
</html>
